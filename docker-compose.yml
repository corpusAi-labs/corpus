# Local infrastructure for development: `docker compose up -d`
# Then in corpus-server/.env:
#   MONGO_URI=mongodb://localhost:27017/corpus
#   REDIS_URL=redis://localhost:6379
# (Deep Recall uses the in-app vector engine locally; Atlas is used in production.)
services:
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
  redis:
    image: redis:7.2-alpine
    # Ephemeral by design: everything Corpus keeps in Redis has a TTL
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
volumes:
  mongo-data:
